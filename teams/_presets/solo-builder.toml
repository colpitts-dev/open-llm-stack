# Preset solo-builder (plan 16): one builder and one coordinator. The coordinator briefs and scores; reviews come from the humans, so required_approvals is met by a person.
# `make team-new T=<name> FROM=solo-builder` copies it, rewrites name and org, and stubs a persona per member. Edit, then `make team-render`.
name = "TEAM"               # rewritten by make team-new T=<name>
org = "TEAM"                # rewritten by make team-new: the Gitea organisation the team works in
model = "ornith-max"        # every member's model unless a member sets its own; a model_name in proxy/config.yaml
# ci_label = "python"       # optional: forces TEAM_CI_LABEL in .env (python = bundled runner, ci = the forge's); unset = .env keeps its own value
humans = []                 # pubkeys of the people the agents obey, owner first; blank here = TEAM_ALLOWLIST in .env

[[members]]
name = "ada"
role = "builder"

[[members]]
name = "grace"
role = "coordinator"
heartbeat = 0               # seconds between proactive triage ticks; 0 = off
