# The default team (plan 16, pipeline shape since plan 16.5). Edit, then `make team-render`. Member order is the roster order and the allowlist order.
name = "piedpiper"          # the team: directory name, TEAM_NAME in .env
org = "piedpiper"           # the Gitea organisation the team works in (TEAM_GITEA_ORG): created if missing, reused if present
model = "qwen3.8-q5"
# ci_label = "python"       # optional: forces TEAM_CI_LABEL in .env (python = bundled runner, ci = the forge's); unset = .env keeps its own value
humans = []                 # pubkeys of the people the agents obey, owner first; blank here = TEAM_ALLOWLIST in .env

[[members]]
name = "jared"              # login, service, volume team-jared, keys TEAM_JARED_*; display "Jared"
role = "coordinator"
title = "coordinator: routes every job and relays what is still open"
heartbeat = 0               # seconds between proactive triage ticks; 0 = off (plan 14: a tick is ~13 full-prefill calls)

[[members]]
name = "gilfoyle"
role = "builder"
title = "senior engineer: plans first, builds after approval"

[[members]]
name = "dinesh"
role = "reviewer"
title = "developer and QA: reviews and checks conformance against the approved plan"

[[members]]
name = "monica"
role = "adversary"
title = "red team: attacks every PR blind, in her own channel"

[[members]]
name = "erlich"
role = "gatekeeper"
title = "gatekeeper and judge: binary ship verdict from the evidence, plus the score, in his own channel"
